security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        harsh:
            algorithm: auto
            cost: 15
    providers:
        users_in_memory: { memory: null }
        admin_user_provider:
            entity:
                class: Aropixel\AdminBundle\Entity\User
                property: email

    role_hierarchy:
        ROLE_USER:           [ROLE_USER]
        ROLE_ADMIN:          [ROLE_ADMIN]
        ROLE_CONTENT_EDITOR: [ROLE_ADMIN]
        ROLE_SUPER_ADMIN:    [ROLE_CONTENT_EDITOR, ROLE_ALLOWED_TO_SWITCH]
        ROLE_HYPER_ADMIN:    [ROLE_SUPER_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        backoffice:
            context: primary_auth
            pattern: ^/admin
            form_login:
                provider: admin_user_provider
                login_path: aropixel_admin_security_login
                use_forward: true
                use_referer: true
                check_path: aropixel_admin_security_check
                failure_path: aropixel_admin_security_login
                default_target_path: dashboard
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /admin
            logout:
                path: aropixel_admin_security_logout
                target: aropixel_admin_security_login
            entry_point: Aropixel\AdminBundle\Component\Security\LoginFormAuthenticator
            custom_authenticators:
                - Aropixel\AdminBundle\Component\Security\LoginFormAuthenticator
            provider: admin_user_provider
        dev:
            pattern: ^/(_(profiler|_wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/admin/login$, role: PUBLIC_ACCESS }
        - { path: ^/admin/reset/, role: PUBLIC_ACCESS }
        - { path: ^/admin/activation/, role: PUBLIC_ACCESS }
        - { path: ^/admin/first/, role: PUBLIC_ACCESS }
        - { path: ^/admin/download/, role: PUBLIC_ACCESS }
        - { path: ^/admin, role: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
